# ============================================================================
# EventFlow frontend - nginx server block
# ============================================================================
# Copied to /etc/nginx/conf.d/default.conf by the Dockerfile.
#
# Two jobs:
#   1. Serve the Vite build output with correct cache lifetimes.
#   2. Answer any unknown path with index.html so React Router handles deep
#      links (the app uses browser history, not hash routing).
# ============================================================================

server {
    listen      80;
    listen      [::]:80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    charset       utf-8;
    server_tokens off;

    # ------------------------------------------------------------------
    # Compression
    # ------------------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_min_length   1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # ------------------------------------------------------------------
    # Baseline security headers
    # ------------------------------------------------------------------
    # Caching below uses the `expires` directive on purpose: nginx discards
    # inherited add_header lines in any location that declares its own
    # add_header, so using add_header for Cache-Control would silently drop
    # these three.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ------------------------------------------------------------------
    # App shell - always revalidate so a new release is picked up promptly
    # ------------------------------------------------------------------
    location = /index.html {
        expires -1;
    }

    # ------------------------------------------------------------------
    # Service workers - the browser must never hold a stale copy, otherwise
    # a broken or outdated worker can keep serving old content.
    # ------------------------------------------------------------------
    location = /sw.js {
        expires   -1;
        try_files $uri =404;
    }

    location = /firebase-messaging-sw.js {
        expires   -1;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        expires   -1;
        try_files $uri =404;
    }

    # ------------------------------------------------------------------
    # Hashed build output - content changes whenever the filename does, so it
    # can be cached for a year.
    # ------------------------------------------------------------------
    location /assets/ {
        expires   1y;
        try_files $uri =404;
    }

    location ~ ^/workbox-[^/]+\.js$ {
        expires   1y;
        try_files $uri =404;
    }

    # ------------------------------------------------------------------
    # Everything else: static file if it exists, otherwise the SPA shell.
    # ------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ------------------------------------------------------------------
    # Optional: same-origin API proxy
    # ------------------------------------------------------------------
    # Only needed when the frontend and backend share a host (for example
    # docker compose with a service named "backend"). Build the frontend with
    # VITE_API_BASE_URL=/api/eventflow to use it. Left disabled by default
    # because the app normally calls the backend on its own origin.
    #
    # location /api/ {
    #     proxy_pass         http://backend:8080;
    #     proxy_set_header   Host              $host;
    #     proxy_set_header   X-Real-IP         $remote_addr;
    #     proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    #     proxy_set_header   X-Forwarded-Proto $scheme;
    # }
}
